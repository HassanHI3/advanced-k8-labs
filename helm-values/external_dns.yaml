Provider: aws

env:
  - name: AWS_DEFAULT_REGION
    value: eu-west-2


domainFilters:
  - hassanhome.com # specifies only manage this Domain name

serviceAccount:
  create: true
  name: external-dns
  annotations:
    eks.amazonaws.com/role-arn: ${module.external_dns_irsa.arn} # This allows External DNS to assume the AWS IAM role using IRSA/OIDC = it adds the IAM role ARN as an annotation on the External DNS service account.